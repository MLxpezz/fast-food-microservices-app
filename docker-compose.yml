name: "fast-food-app"

services:
  users_db:
    container_name: users_db
    image: postgres:17
    restart: always
    ports:
      - "15432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
  food_db:
    container_name: food_db
    image: postgres:17
    restart: always
    ports:
      - "25432:5432"
    environment:
      POSTGRES_PASSWORD: ${FOOD_POSTGRES_PASSWORD}
      POSTGRES_USER: ${FOOD_POSTGRES_USER}
      POSTGRES_DB: ${FOOD_POSTGRES_DB}