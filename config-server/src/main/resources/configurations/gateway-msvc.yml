server:
  port: 8080

spring:
  application:
    name: gateway-msvc
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: users-msvc-users
          predicates:
            - Path=/api/v1/users/**
          uri: lb://users-msvc
        - id: users-msvc-customers
          predicates:
            - Path=/api/v1/customers/**
          uri: lb://users-msvc
        - id: auth-msvc
          predicates:
            - Path=/api/v1/auth/**
          uri: lb://auth-msvc

