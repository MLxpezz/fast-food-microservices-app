server:
  port: 8080

spring:
  application:
    name: gateway-msvc
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: users-msvc
          predicates:
            - Path=/api/v1/users/**
          uri: http://localhost:9080
        - id: auth-msvc
          predicates:
            - Path=/api/v1/auth/**
          uri: http://localhost:9081

